# VLM Benchmarking Pipeline Configuration File - Task 2 (Text-in-Image)

# ---------------------------------------------------------
# 1. Dataset Configuration
# ---------------------------------------------------------
dataset:
  jsonl_path: "project/datasets/images_scripts_multilingual.jsonl" # Path to the JSONL dataset file (e.g., signs.jsonl)
  images_dir: "project/datasets/images"           # Directory where local images are stored or cached
  max_images: null                                # Limit images for test runs (null/empty for all)
  download_missing: true                          # Automatically download images from URL if missing locally

# ---------------------------------------------------------
# 2. Output and Logging Paths
# ---------------------------------------------------------
paths:
  project_root: "."
  dataset_root: "project/datasets"
  output_root: "project/outputs"                  # Raw JSON output checkpoints
  evaluation_root: "project/reports"              # Final leaderboards and graphs
  logs_root: "project/logs"
  prompts_root: "project/prompts"

# ---------------------------------------------------------
# 3. Model Providers & API Parameters
# ---------------------------------------------------------
# Set 'enabled: true' to run a model. You can run multiple sequentially.
models:
  # Cloud API Models
  gpt4o:
    enabled: true
    provider: "openai"
    model_name: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    temperature: 0.0
  gemini:
    enabled: false
    provider: "google"
    model_name: "gemini-2.5-flash"
    api_key_env: "GEMINI_API_KEY"
    temperature: 0.0
  
  # Local HuggingFace Models
  qwen:
    enabled: false
    provider: "huggingface"
    model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
    trust_remote_code: true
  internvl:
    enabled: false
    provider: "huggingface"
    model_id: "OpenGVLab/InternVL2_5-8B"
    trust_remote_code: true
  minicpm:
    enabled: false
    provider: "huggingface"
    model_id: "openbmb/MiniCPM-Llama3-V-2_5"
    trust_remote_code: true
  llama:
    enabled: false
    provider: "huggingface"
    model_id: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    trust_remote_code: true

# ---------------------------------------------------------
# 4. Hardware & Runtime Engine Settings
# ---------------------------------------------------------
runtime:
  device: "cuda"                        # 'cuda' or 'cpu'
  default_precision: "bf16"             # Base precision (bf16, fp16, float32)
  quantization: "4bit"                  # VRAM optimization (none, 4bit, 8bit)
  resume: true                          # Skip already processed images
  random_seed: 42
  deterministic: true

# ---------------------------------------------------------
# 5. Pipeline Tasks (Text-in-Image)
# ---------------------------------------------------------
task_2_options:
  enable_ocr: true                      # Extract raw visible text exactly as it appears
  enable_script_detection: true         # Detect script families (e.g., Latin, Devanagari)
  enable_language_detection: true       # Detect specific spoken languages
  enable_translation: true              # Translate regional text to English
  enable_transliteration: true          # Romanize phonetic pronunciation
  enable_text_qa: true                  # Generate deep-reasoning text-aware QA pairs

# ---------------------------------------------------------
# 6. Evaluation & Reporting
# ---------------------------------------------------------
evaluation:
  weights:
    schema_compliance: 0.20             # Exact mapping to JSON schema
    ocr_accuracy: 0.35                  # Text matching against ground truth
    language_accuracy: 0.15             # Correctly identified language
    qa_relevance: 0.20                  # Relevance of generated QA to text
    latency_score: 0.10                 # Time taken per inference
  
  report_generation:
    generate_pdf: true                  # Compile the markdown into a PDF
    generate_leaderboard: true          # Export results to CSV/Excel
    plot_latency_graphs: true           # Generate visual graphs for execution speeds
prompt:
  prompt_file: "project/prompts/benchmark_prompt.txt"
